name: Build and test dotPaint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Go 1.23.2 (matching v1.3.3 handoff)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false

      - name: Go unit tests
        working-directory: source
        run: go test ./...

      - name: Go vet
        working-directory: source
        run: go vet ./...

      - name: Cross-compile Windows x64 / x86 / development log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd source
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w' -o ../dist/dotPaint_1.3.3_x64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w' -o ../dist/dotPaint_1.3.3_x86.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -buildvcs=false -tags devlog -trimpath -ldflags='-H=windowsgui' -o ../dist/dotPaint_1.3.3_DEVELOPMENT_LOG_x64.exe .

      - name: Check normal EXE size (10 MiB max, dev-log unrestricted)
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/dotPaint_1.3.3_x64.exe dist/dotPaint_1.3.3_x86.exe; do
            bytes=$(stat -c%s "$f")
            echo "$f: $bytes bytes"
            test "$bytes" -le 10485760 || { echo "ERROR: Normal EXE is over 10 MiB"; exit 1; }
          done
          stat -c 'Development log EXE: %s bytes (no size limit)' dist/dotPaint_1.3.3_DEVELOPMENT_LOG_x64.exe

      - name: Store compiled EXEs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotPaint-v1.3.3-Windows-CI
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
