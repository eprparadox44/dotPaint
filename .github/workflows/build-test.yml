name: Build and test dotPaint 2.0.1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Go 1.23.2
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Require official version source
        run: grep -qE '^const appVersion = "2[.]0[.]1"$' source/main_windows.go
      - name: Run all Go tests
        run: go -C source test ./...
      - name: Run static analysis
        run: go -C source vet ./...
      - name: Build Windows x64 release and diagnostic binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go -C source build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w -buildid=' -o ../dist/dotPaint_2.0.1_x64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go -C source build -buildvcs=false -tags devlog -trimpath -ldflags='-H=windowsgui -buildid=' -o ../dist/dotPaint_2.0.1_DEVLOG_x64.exe .
      - name: Verify release size and hashes
        run: |
          set -euo pipefail
          bytes=$(stat -c%s dist/dotPaint_2.0.1_x64.exe)
          echo "Release size: $bytes bytes"
          test "$bytes" -le 10485760
          echo 'Diagnostic build has no size cap.'
          sha256sum dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dotPaint-v2.0.1-Windows-CI
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
