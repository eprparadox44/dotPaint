name: Publish dotPaint v2.0.1

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - '.github/workflows/publish-v2.0.1.yml'
      - 'RELEASE_NOTES_2.0.1.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Go 1.23.2
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Guard release version and release notes
        run: |
          set -euo pipefail
          grep -qE '^const appVersion = "2[.]0[.]1"$' source/main_windows.go
          test -s RELEASE_NOTES_2.0.1.md
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
      - name: Run all Go tests
        run: go -C source test ./...
      - name: Go vet
        run: go -C source vet ./...
      - name: Build Windows x64 standard executable
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go -C source build -buildvcs=false -trimpath -ldflags='-H=windowsgui -s -w -buildid=' -o ../dist/dotPaint_2.0.1_x64.exe .
      - name: Verify executable size and reproducible SHA-256
        run: |
          set -euo pipefail
          test "$(head -c 2 dist/dotPaint_2.0.1_x64.exe)" = 'MZ'
          size=$(stat -c%s dist/dotPaint_2.0.1_x64.exe)
          echo "2.0.1 standard x64: $size bytes"
          test "$size" -le 10485760
          echo '808b2d9856896fbe44ea54ab58b52a861bcc30aae336ec7fce8851945f610410  dist/dotPaint_2.0.1_x64.exe' | sha256sum -c -
      - name: Publish official v2.0.1 stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v2.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v2.0.1 already exists. Refusing to replace existing release.'
            exit 0
          fi
          gh release create v2.0.1 dist/dotPaint_2.0.1_x64.exe \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'dotPaint 2.0.1 — Raster Mode Preferences and Bilingual License Info' \
            --notes-file RELEASE_NOTES_2.0.1.md --latest
